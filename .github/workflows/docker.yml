name: "Docker Build"
on:
  workflow_dispatch: {}
  # build a daily dev image
  schedule:
    - cron: "42 6 * * *"
  push:
    tags:
      # todo: update for 1.0
      - 0.*

permissions: {}

env:
  UV_VERSION: "0.7.12"

jobs:
  Publish:
    permissions:
      # job level permissions replace the workflow level ones wholesale,
      # so contents has to be restated for actions/checkout
      contents: read
      id-token: write
    strategy:
      matrix:
        image:
          - c7n
          - c7n-kube
          - c7n-org
          - mailer
          - policystream
          - c7n-left
    # the larger runner only exists on the upstream repo; forks would queue
    # against a label nothing ever picks up
    runs-on: ${{ github.repository == 'cloud-custodian/cloud-custodian' && 'ubuntu-latest-8-cores' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - name: ${{ matrix.image }} build and push
        uses: ./.github/composites/docker-build-push
        env:
          HUB_USER: c7nbuild
          HUB_TOKEN: ${{ secrets.DOCKER_CI_HUB_TOKEN }}
        with:
          name: ${{ matrix.image }}
          push: true
          platforms: linux/arm64,linux/amd64
          uv-version: ${{ env.UV_VERSION }}

      - name: Notify Slack
        uses: ravsamhq/notify-slack-action@be814b201e233b2dc673608aa46e5447c8ab13f2 # ratchet:ravsamhq/notify-slack-action@v2
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_CI_HOOK }}
        with:
          status: ${{ job.status }}
          notification_title: "{workflow}:{job} has {status_message}"
          message_format: "{emoji} *{workflow}:{job}* {status_message} in <{repo_url}|{repo}>"
          footer: "Logs <{run_url}|{job}>"
          notify_when: "failure,success"
