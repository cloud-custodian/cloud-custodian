name: "Plumber"
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  Plumber:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # to read the workflow states and one run log, which proves the token scope
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - name: Plumber Score
        uses: getplumber/plumber@v0.7.23
        with:
          min-points: 85
          score-push: true
          # the code scanning upload needs a write token, which pull requests from forks do not get
          upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
