name: "Install"
description: "Install Cloud Custodian"
inputs:
  python-version:
    required: true
  uv-version:
    default: "0.7.12"
outputs:
  uv-version:
    description: "uv version"
    value: ${{ steps.echo-uv-version.outputs.uv-version }}

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # ratchet:astral-sh/setup-uv@v8.1.0
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true

    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # ratchet:actions/setup-python@v6.2.0
      with:
        python-version: ${{ inputs.python-version }}

    # cache keys are immutable, so a bad venv can't be replaced under the key
    # it was restored from. restore by prefix and save under a per-run key
    # instead, the newest entry for the prefix wins on the next restore.
    - name: Set up cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache/restore@v5.0.5
      id: cache
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          venv-${{ runner.os }}-${{ inputs.python-version }}-${{ hashFiles('uv.lock') }}-

    - name: Update PATH
      shell: bash
      run: |
        if [[ "$OSTYPE" == "msys" ]]
        then
          echo "$PWD\.venv\Scripts" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD\.venv" >> $GITHUB_ENV
        else
          echo "$PWD/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$PWD/.venv" >> $GITHUB_ENV
        fi

    - name: Ensure cache is healthy
      if: steps.cache.outputs.cache-matched-key != ''
      id: cache_check
      shell: bash
      run: |
        if uv run --no-sync custodian version ; then
           echo "venv=success" >> $GITHUB_OUTPUT
           echo "Cache Green"
        else
           rm -rf .venv
           echo "venv=recreate" >> $GITHUB_OUTPUT
           echo "Cache Red"
        fi

    - name: Install
      if: steps.cache.outputs.cache-matched-key == '' || steps.cache_check.outputs.venv != 'success'
      shell: bash
      env:
        CHECK_VENV: ${{ steps.cache_check.outputs.venv }}
        CACHE_KEY: ${{ steps.cache.outputs.cache-matched-key }}
      run: |
        echo "check venv $CHECK_VENV"
        echo "restored cache key $CACHE_KEY"
        if [ -d ".venv" ]; then
          mv .venv .venv-old
        fi
        make install

    - name: Output UV Version
      shell: bash
      id: echo-uv-version
      run: echo "uv-version=${{ inputs.uv-version }}" >> $GITHUB_OUTPUT

    - name: Build awscc data files
      shell: bash
      run: cd tools/c7n_awscc && uv run python build.py


    # save whenever the venv was built here: nothing was restored (the plain
    # actions/cache post step used to cover this) or the restored one was bad.
    - name: Save cache
      if: steps.cache.outputs.cache-matched-key == '' || steps.cache_check.outputs.venv == 'recreate'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache/save@v5.0.5
      with:
        path: .venv
        key: ${{ steps.cache.outputs.cache-primary-key }}
